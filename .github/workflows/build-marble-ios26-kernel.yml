name: Build the iOS 26 (xnu-12377) kernel for marble
# Builds the HackiOS xnu-12377 (iOS 26) kernel for the REDMI Note 12 Turbo with the K90 tree
# (iola1999/hackios-xnu-kernel, branch k90-port) plus marble's platform description.
on:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode version to select; empty means the newest installed"
        required: false
        default: ""
      k90_ref:
        description: "Commit of iola1999/hackios-xnu-kernel to build (a SHA pins the tree)"
        required: false
        # 5fbfda6b produced the kernel we are debugging. The branch head (02de166) rewrote
        # build-macos.sh and its tree no longer compiles the UBSan runtime (san/memory) for
        # BCM2837, so stay on this SHA until that is fixed upstream.
        default: "5fbfda6b26c7d9411db11943627a245041d1ca96"
      marble_ref:
        description: "Commit of yukoimi/hackios-marble to take the marble Adreno 725 GPU/display stack from"
        required: false
        # The iOS 16.5 tree that boots this phone with SpringBoard drawing through Mesa on the
        # Adreno 725 (a730 firmware, Gen7_4_0), including marble_adreno.c, the ArmSmmu4K/Adreno
        # HFI helpers it builds on, and the MarbleGPURing bridge RedwoodGPU.cpp grows.
        default: "8e50e532f09b3042165048c3c72e04b5a8e68898"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      XNU_ROOT: ${{ github.workspace }}/tree
    steps:
      - name: Select Xcode
        run: |
          set -e
          want="${{ inputs.xcode }}"
          if [ -n "$want" ] && [ -d "/Applications/Xcode_$want.app" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_$want.app/Contents/Developer" >> "$GITHUB_ENV"
          else
            pick=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            echo "DEVELOPER_DIR=$pick/Contents/Developer" >> "$GITHUB_ENV"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Check out the K90 tree
        uses: actions/checkout@v4
        with:
          repository: iola1999/hackios-xnu-kernel
          ref: ${{ inputs.k90_ref }}
          path: tree
          fetch-depth: 1
          submodules: false

      - name: Report which tree we got
        run: |
          set -e
          cd tree
          echo "commit: $(git rev-parse HEAD)"
          git log -1 --format='%h %ad %s' --date=short
          echo "patches in the series: $(wc -l < xnu26/patches/series)"
          ls -d xnu xnu26 2>/dev/null || true

      - name: Add marble
        run: |
          set -e
          mkdir -p tree/common/devices
          cat > tree/common/devices/marble.conf <<'CONF'
          NAME="REDMI Note 12 Turbo / POCO F5 (marble)"
          KIND=phone
          SOC="Qualcomm SM7475 (Snapdragon 7+ Gen 2)"
          UEFI_TARGET=marble
          UEFI_FD=
          DTB=
          FD_BASE=0xA7100000
          FD_SIZE=0x300000
          PAYLOAD_BASE=0xAA000000
          PAYLOAD_CAP=0x03700000
          FB_BASE=0xB8000000
          LOADER_CFLAGS=""
          WIFI_ATH11K=0
          BOOTARGS="touchscreen=0 cpus=8"
          DEFAULT_SECS=900
          USERLAND_VARS=""
          FIRMWARE=""
          CONF
          python3 - <<'PY'
          p = 'tree/xnuloader/platform_private.h'
          s = open(p).read()
          if 'platform_marble' not in s:
              entry = '''
          /*
           * marble (REDMI Note 12 Turbo / POCO F5, SM7475): GIC 0x17100000 + redistributor 0x17180000
           * (2 MiB, 0x40000 stride), eight cores 0..700, four A510 small cores, GOP splash 0xB8000000.
           */
          static const struct platform platform_marble = {
          \t.name = "marble", .io_base = 0x00400000, .io_size = 0x3FC00000,
          \t.gic_dist = 0x17100000, .gic_redist = 0x17180000,
          \t.gic_redist_size = 0x200000, .gic_redist_stride = 0x40000,
          \t.uart = 0, .log_other_cpu = 1,
          \t.cores = 8, .core_mpidr = {0, 0x100, 0x200, 0x300, 0x400, 0x500, 0x600, 0x700},
          \t.small_cores = 0x0f,
          \t.fb_base = 0xB8000000,
          };
          '''.replace('\\t', '\t')
              anchor = '\n/*\n * The devices the loader knows'
              assert anchor in s
              s = s.replace(anchor, entry + anchor, 1)
              s = s.replace('\t&platform_annibale,\n};', '\t&platform_annibale,\n\t&platform_marble,\n};', 1)
              open(p, 'w').write(s)
          print('platform_private.h: marble present')
          PY

      - name: Add the marble-gpu device tree node to the loader
        run: |
          set -e -o pipefail
          cd tree
          python3 - <<'PY'
          p = 'xnuloader/loader_05_layout_run_kernel.inc'
          s = open(p, encoding='utf-8').read()
          if 'marble-gpu' in s:
              print('the loader already has the node')
          else:
              anchor = '\tdt_begin(&w, "gic");\n'
              if anchor not in s:
                  raise SystemExit('anchor missing: the gic node')
              node = (
                  '\t/* The Adreno 725 node marble_adreno.c looks up, with the windows of this phone. */\n'
                  '\tif (str_eq(plat->name, "marble")) {\n'
                  '\t\tdt_begin(&w, "marble-gpu");\n'
                  '\t\tdt_prop_str(&w, "compatible", "marble,adreno725-preflight-v1");\n'
                  '\t\tdt_prop_u32(&w, "chip-id", 0x07030002);\n'
                  '\t\tuint64_t windows[] = {\n'
                  '\t\t    0x03d00000, 0x40000, 0x03d68000, 0x37000, 0x03d90000, 0xa000,\n'
                  '\t\t    0x03d50000, 0x10000, 0x03da0000, 0x40000, 0x0b290000, 0x10000,\n'
                  '\t\t    0x03d40000, 0x10000 };\n'
                  '\t\tdt_prop(&w, "windows", windows, sizeof(windows));\n'
                  '\t\tuint64_t tbu[] = { 0x03de6000, 0x20, 0x03de9000, 0x1000, 0x03de6200, 8 };\n'
                  '\t\tdt_prop(&w, "tbu-windows", tbu, sizeof(tbu));\n'
                  '\t\tuint64_t cmd_db[] = { 0x80860000, 0x20000 };\n'
                  '\t\tdt_prop(&w, "cmd-db-window", cmd_db, sizeof(cmd_db));\n'
                  '\t\tuint64_t rpmh[] = { 0x17a20d00, 0x100 };\n'
                  '\t\tdt_prop(&w, "rpmh-window", rpmh, sizeof(rpmh));\n'
                  '\t\tuint64_t boot[] = { 0x03d9e000, 0x1000 };\n'
                  '\t\tdt_prop(&w, "gmu-boot-window", boot, sizeof(boot));\n'
                  '\t\tdt_end(&w);\n'
                  '\t}\n'
              )
              s = s.replace(anchor, node + anchor, 1)
              open(p, 'w', encoding='utf-8').write(s)
              print('node inserted before the gic node')
          PY
          grep -n 'marble-gpu' xnuloader/loader_05_layout_run_kernel.inc
      - name: Install the build tools
        run: |
          set -e
          brew list make >/dev/null 2>&1 || brew install make
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          /opt/homebrew/opt/make/libexec/gnubin/gmake --version | head -1
          echo "MAKE=gmake" >> "$GITHUB_ENV"
          echo "MAKEJOBS=-j4" >> "$GITHUB_ENV"
          # The tree's Makefile asks `nproc` for the CPU count (xnu26/patches/01-Makefile.patch), which is
          # a coreutils tool: macOS does not have it, and an empty answer turns MAKEJOBS into a bare --jobs=.
          printf '#!/bin/sh\nsysctl -n hw.logicalcpu\n' | sudo tee /usr/local/bin/nproc >/dev/null
          sudo chmod 755 /usr/local/bin/nproc
          nproc

      - name: Fetch xnu-12377 and apply the HackiOS work
        run: |
          set -e -o pipefail
          cd tree
          # Some of the shipped patches carry hunk headers whose line counts are stale (the work was edited
          # after the patch was cut); --recount makes git recalculate them instead of refusing the patch.
          perl -pi -e 's/git apply --whitespace=nowarn/git apply --whitespace=nowarn --recount/' xnu26/apply.sh
          grep -n 'git apply' xnu26/apply.sh
          bash xnu26/apply.sh
          echo "--- patches applied:"
          wc -l < xnu26/patches/series

      - name: Add the bring-up checkpoints (xnu26-bringup-edits)
        run: |
          set -e -o pipefail
          echo '' | base64 -D > /tmp/bringup.py
          cd tree/xnu-src/xnu-12377.121.6
          python3 /tmp/bringup.py
          echo "--- checkpoints:"
          grep -n 'loader_checkpoint([0-9]' osfmk/kern/startup.c bsd/kern/bsd_init.c
          echo "--- framebuffer mapping:"
          grep -n 'HAS_UCNORMAL_MEM' osfmk/console/video_console.c

      - name: Stage the macOS dependencies
        run: |
          set -e -o pipefail
          cd tree
          bash xnu26/deps-macos.sh --stage1

      - name: Export the kernel headers
        run: |
          set -eo pipefail
          cd tree
          mkdir -p logs
          bash xnu26/build-macos.sh exporthdrs installhdrs > logs/exporthdrs.log 2>&1 || {
            echo "===== exporthdrs failed; the commands that ran:"
            grep -n 'gmake\|/usr/bin/make\|XCRUN' logs/exporthdrs.log | tail -20
            echo "===== the lines before the usage text:"
            grep -n -B12 -A2 'This program built for' logs/exporthdrs.log | head -60
            echo "===== the first errors:"
            grep -n -m5 -E 'error|Error|No rule|not found' logs/exporthdrs.log | head -20
            exit 1
          }
          tail -5 logs/exporthdrs.log
          ls -d xnu-src/xnu-12377.121.6/BUILD/obj/*/ 2>/dev/null || echo "no BUILD/obj yet"

      - name: Stage the kernel libraries
        run: |
          set -e -o pipefail
          cd tree
          bash xnu26/deps-macos.sh --stage2

      - name: Re-apply the bring-up checkpoints (the deps step may re-extract the tree)
        run: |
          set -e -o pipefail
          cd tree/xnu-src/xnu-12377.121.6
          python3 /tmp/bringup.py
          grep -c 'loader_checkpoint([0-9]' osfmk/kern/startup.c

      - name: Port the marble GPU stack (Adreno 725) onto the tree
        run: |
          set -e -o pipefail
          MARBLE_REF="${{ inputs.marble_ref }}"
          echo "hackios-marble ref: $MARBLE_REF"
          rm -rf /tmp/hm /tmp/hm.tar.gz
          curl -fsSL --retry 3 -o /tmp/hm.tar.gz "https://codeload.github.com/yukoimi/hackios-marble/tar.gz/$MARBLE_REF"
          mkdir -p /tmp/hm
          tar -xzf /tmp/hm.tar.gz -C /tmp/hm --strip-components=1
          SRC=/tmp/hm/xnu/files
          ls -l "$SRC/bsd/dev/marble_adreno.c" "$SRC/bsd/dev/marble_smmu.c" "$SRC/iokit/Kernel/MarbleGPURing.inc"
          cd tree/xnu-src/xnu-12377.121.6
          cp -v "$SRC/bsd/dev/marble_adreno.c" bsd/dev/
          cp -v "$SRC/bsd/dev/marble_smmu.c" bsd/dev/
          rm -rf bsd/dev/marble_gpu
          mkdir -p bsd/dev/marble_gpu
          cp -R "$SRC/bsd/dev/marble_gpu/." bsd/dev/marble_gpu/
          cp -v "$SRC/iokit/Kernel/MarbleGPURing.inc" iokit/Kernel/
          echo "headers: $(find bsd/dev/marble_gpu -name '*.h' | wc -l)  sources: $(find bsd/dev/marble_gpu -name '*.c' | wc -l)"
          python3 - <<'PY'
          import glob, sys

          def read(p): return open(p, encoding='utf-8').read()
          def write(p, s): open(p, 'w', encoding='utf-8').write(s)

          # 1) bsd/conf/files: the marble sources, the same list the iOS 16.5 tree builds
          conf = 'bsd/conf/files'
          s = read(conf)
          entries = [
              'bsd/dev/marble_adreno.c',
              'bsd/dev/marble_smmu.c',
              'bsd/dev/marble_gpu/upstream/AdrenoPM4.c',
              'bsd/dev/marble_gpu/upstream/AdrenoFirmware.c',
              'bsd/dev/marble_gpu/upstream/AdrenoHfi.c',
              'bsd/dev/marble_gpu/upstream/AdrenoHfiStartup.c',
              'bsd/dev/marble_gpu/upstream/AdrenoHfiVotes.c',
              'bsd/dev/marble_gpu/upstream/ArmSmmu4K.c',
              'bsd/dev/marble_gpu/upstream/ArmSmmu4KContext.c',
              'bsd/dev/marble_gpu/upstream/ArmSmmu4KProgram.c',
              'bsd/dev/marble_gpu/upstream/ArmSmmu4KStreams.c',
              'bsd/dev/marble_gpu/upstream/ArmSmmu4KAudit.c',
              'bsd/dev/marble_gpu/upstream/ArmSmmu4KLive.c',
          ]
          if 'marble_adreno.c' not in s:
              s = s.rstrip('\n') + '\n' + ''.join(e + '\tstandard\n' for e in entries)
              write(conf, s)
          print('conf/files: marble lines =', sum(1 for l in read(conf).splitlines() if 'marble' in l))

          # 2) redwood_adreno.c: let the marble driver take the GPU on this board
          cands = glob.glob('bsd/dev/**/redwood_adreno.c', recursive=True)
          if not cands:
              sys.exit('no redwood_adreno.c in the tree')
          p = cands[0]
          s = read(p)
          if 'marble_adreno_init' not in s:
              a_init = 'void\nredwood_adreno_init(void)\n{\n'
              hook_init = a_init + ('\textern bool marble_adreno_init(void);\n'
                                    '\tif (marble_adreno_init()) return;\n')
              if a_init not in s:
                  sys.exit('anchor missing: redwood_adreno_init')
              s = s.replace(a_init, hook_init, 1)
              a_q = 'void\nredwood_adreno_quiesce(void)\n{\n'
              hook_q = a_q + ('\textern bool marble_adreno_quiesce(void);\n'
                              '\tif (marble_adreno_quiesce()) return;\n')
              if a_q in s:
                  s = s.replace(a_q, hook_q, 1)
              write(p, s)
          print('hooks in:', p)

          # 2b) the allocator marble's private aperture comes from
          s = read(p)
          if 'redwood_gpu_marble_allocator' not in s:
              inc = '#include "redwood_gpu_service.inc"\n'
              if inc not in s:
                  sys.exit('anchor missing: redwood_gpu_service.inc')
              alloc = inc + (
                  '\n/* marble keeps the 3D core to a private aperture: reset once, before any client. */\n'
                  'void\n'
                  'redwood_gpu_marble_allocator(void)\n'
                  '{\n'
                  '\tif (gpu_free_count || gpu_va_live)\n'
                  '\t\tpanic("marble GPU allocator already used");\n'
                  '\tgpu_free[0].start = 0x4000000;\n'
                  '\tgpu_free[0].size = 0x1c000000;\n'
                  '\tgpu_free_count = 1;\n'
                  '}\n')
              s = s.replace(inc, alloc, 1)
              write(p, s)
          print('allocator in:', p)

          # 3) RedwoodGPU.cpp: the C bridge the marble driver submits through
          g = 'iokit/Kernel/RedwoodGPU.cpp'
          s = read(g)
          if 'MarbleGPURing.inc' not in s:
              anchor = '#include "MiniIOSurface.h"\n'
              if anchor not in s:
                  sys.exit('anchor missing: MiniIOSurface.h in RedwoodGPU.cpp')
              s = s.replace(anchor, anchor + '#include "MarbleGPURing.inc"\n', 1)
              write(g, s)
          print('RedwoodGPU.cpp: ring bridge included')
          PY
          echo "--- marble port in place ---"
          grep -c 'marble' bsd/conf/files
          grep -n 'marble_adreno_init' bsd/dev/redwood_adreno.c bsd/dev/*/redwood_adreno.c 2>/dev/null || true
          grep -n 'MarbleGPURing' iokit/Kernel/RedwoodGPU.cpp

      - name: Build the kernel
        run: |
          set -eo pipefail
          cd tree
          mkdir -p logs
          bash xnu26/build-macos.sh > logs/kernel.log 2>&1 || {
            echo "===== the kernel build failed; the first errors:"
            grep -n -m10 -E ': error:|Error [0-9]|No rule|not found' logs/kernel.log | head -30
            exit 1
          }
          tail -5 logs/kernel.log
          ls -l out || true

      - name: Build the loader
        run: |
          set -eo pipefail
          brew list llvm >/dev/null 2>&1 || brew install llvm
          # Homebrew ships the linker in its own formula ("lld"); the llvm one has no lld-link.
          brew list lld >/dev/null 2>&1 || brew install lld
          CC="$(brew --prefix llvm)/bin/clang"
          LLD_BIN="$(brew --prefix lld)/bin"
          echo "arch: $(uname -m)"
          echo "cc: $CC"
          echo "lld bin: $LLD_BIN"
          ls -l "$LLD_BIN" || true
          if [ -x "$LLD_BIN/lld-link" ]; then
            LINK="$LLD_BIN/lld-link"
          elif [ -x "$LLD_BIN/ld64.lld" ]; then
            LINK="$LLD_BIN/ld64.lld -flavor link"
          elif [ -x "$LLD_BIN/lld" ]; then
            LINK="$LLD_BIN/lld -flavor link"
          else
            echo "no linker in $LLD_BIN; looking wider:"
            find /opt/homebrew /usr/local -maxdepth 5 -name 'lld-link' -o -maxdepth 5 -name 'ld64.lld' 2>/dev/null | head -20
            exit 1
          fi
          echo "linking with: $LINK"
          cd tree/xnuloader
          "$CC" --target=aarch64-unknown-windows -ffreestanding -fno-builtin -fno-stack-protector \
            -fshort-wchar -mgeneral-regs-only -O1 -Wall -Wextra -Wno-unused-parameter \
            -c loader.c -o loader.obj
          $LINK /subsystem:efi_application /entry:efi_main /nodefaultlib /base:0xA1000000 \
            /out:loader-marble.efi loader.obj
          ls -l loader-marble.efi
          strings -a loader-marble.efi | grep -c marble || true

      - name: Collect the artifacts
        if: always()
        run: |
          set -e
          mkdir -p upload
          cp -v tree/out/xnu12377-*.bin upload/ 2>/dev/null || true
          cp -v tree/xnuloader/loader-marble.efi upload/ 2>/dev/null || true
          cp -v tree/logs/*.log upload/ 2>/dev/null || true
          ls -l upload

      - name: Upload the kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marble-ios26-kernel
          path: upload
          if-no-files-found: warn
