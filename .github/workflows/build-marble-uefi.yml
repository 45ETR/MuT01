# Minimal, copy-paste-safe version of build-marble-uefi.yml.
# No workflow_dispatch inputs, no heredocs, no shell functions -- fewer chances to break while pasting.
# Put it at .github/workflows/marble-uefi.yml on the DEFAULT branch, then Actions -> marble-uefi -> Run workflow.
name: marble-uefi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FD_BASE: "0xA7100000"
      FD_SIZE: "0x300000"
      PAYLOAD_BASE: "0xAA000000"

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev iasl nasm acpica-tools llvm \
            python3-venv python3-dev gcc-aarch64-linux-gnu

      - name: put llvm-objcopy on PATH
        run: |
          if ! command -v llvm-objcopy >/dev/null; then
            P=$(ls /usr/lib/llvm-*/bin/llvm-objcopy 2>/dev/null | sort -V | tail -1)
            [ -n "$P" ] && sudo ln -sf "$P" /usr/local/bin/llvm-objcopy
          fi
          command -v llvm-objcopy

      - name: clone hackios (patch + files)
        run: git clone --depth 1 https://github.com/oosexgang/hackios-xnu-kernel.git hackios

      - name: clone Mu-Silicium at the pinned commit
        run: |
          BASE=$(tr -d ' \n' < hackios/uefi/BASE)
          git clone https://github.com/Project-Silicium/Mu-Silicium.git Mu-Silicium
          git -C Mu-Silicium checkout "$BASE"
          git -C Mu-Silicium submodule update --init --recursive --jobs 4

      - name: apply the HackiOS changes
        run: |
          git -C Mu-Silicium apply --whitespace=nowarn "$GITHUB_WORKSPACE/hackios/uefi/mu-silicium.patch"
          cp -r hackios/uefi/files/. Mu-Silicium/
          grep -c XNUP Mu-Silicium/BootShim/BootShim.S

      - name: point the XnuLoader hook at marble's PAYLOAD_BASE
        run: |
          H=Mu-Silicium/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/XnuLoader.h
          sed -i 's|^#define XNU_PAYLOAD_BASE .*|#define XNU_PAYLOAD_BASE      0xAA000000ULL|' "$H"
          grep -n 'XNU_PAYLOAD_BASE' "$H"

      - name: comment out the marble ACPI references
        run: |
          grep -rn 'marble/AcpiTables.inf' Mu-Silicium/Platforms/Xiaomi/marblePkg || true
          for f in $(grep -rl 'marble/AcpiTables\.inf' Mu-Silicium/Platforms/Xiaomi/marblePkg); do
            sed -i '/marble\/AcpiTables\.inf/{/^[[:space:]]*#/!s|^|# |}' "$f"
            echo "patched $f"
          done
          grep -rn 'AcpiTables' Mu-Silicium/Platforms/Xiaomi/marblePkg || true

      - name: mu_nasm without Mono
        run: |
          D=Mu-Silicium/Mu_Basecore/BaseTools/Bin/mu_nasm_extdep
          mkdir -p "$D/Linux-x86-64"
          echo 'version: 20016.1.1' > "$D/extdep_state.yaml"
          ln -sf /usr/bin/nasm "$D/Linux-x86-64/nasm"
          ln -sf /usr/bin/ndisasm "$D/Linux-x86-64/ndisasm"

      - name: build the FD
        run: |
          python3 -m venv venv
          venv/bin/python -c "import tomllib"
          venv/bin/pip install -q --upgrade pip
          venv/bin/pip install -q -r Mu-Silicium/pip-requirements.txt
          cd Mu-Silicium
          ../venv/bin/python build_uefi.py -d marble -r RELEASE

      - name: build the boot shim
        run: |
          # build_uefi.py left an up-to-date shim built WITHOUT -DPAYLOAD_BASE; drop it first
          rm -f Mu-Silicium/BootShim/BootShim.elf Mu-Silicium/BootShim/BootShim.bin
          make -C Mu-Silicium/BootShim REQUIRES_KERNEL_HEADER=1 \
            FD_BASE="$FD_BASE" FD_SIZE="$FD_SIZE" \
            CFLAGS="--target=aarch64-linux-gnu -DPAYLOAD_BASE=$PAYLOAD_BASE"
          ls -l Mu-Silicium/BootShim/BootShim.bin
          llvm-objdump -d Mu-Silicium/BootShim/BootShim.elf | grep -iE 'movz[[:space:]]+x5, #0xaa00' \
            || { echo "no payload copy in shim"; exit 1; }

      - name: check the artifact sizes
        run: |
          FD=Mu-Silicium/Build/marblePkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
          ls -l "$FD" Mu-Silicium/BootShim/BootShim.bin
          test "$(stat -c %s "$FD")" -eq 3145728

      - uses: actions/upload-artifact@v4
        with:
          name: marble-uefi
          if-no-files-found: error
          path: |
            Mu-Silicium/Build/marblePkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
            Mu-Silicium/BootShim/BootShim.bin
