# Build the HackiOS-patched marble UEFI on GitHub's runners, so the only thing that has to cross a
# slow link is a ~3 MB artifact instead of a 1 GB+ Mu-Silicium tree.
#
# How to use:
#   1. create an empty public repo (e.g. marble-uefi), put this file at .github/workflows/build-marble-uefi.yml
#   2. push it, open the Actions tab, run "build-marble-uefi"
#   3. download the "marble-uefi" artifact (SILICIUM_UEFI.fd + BootShim.bin)
#
# It clones hackios-xnu-kernel (patch + new files), Mu-Silicium at the commit uefi/BASE pins,
# applies the two HackiOS changes, and builds marblePkg for RELEASE.
name: build-marble-uefi

on:
  workflow_dispatch:
    inputs:
      fd_base:
        description: 'FD_BASE (marble: 0xA7100000)'
        default: '0xA7100000'
      fd_size:
        description: 'FD_SIZE (marble: 0x300000)'
        default: '0x300000'
      payload_base:
        description: 'PAYLOAD_BASE (64 KiB aligned)'
        default: '0xAA000000'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      FD_BASE: ${{ github.event.inputs.fd_base }}
      FD_SIZE: ${{ github.event.inputs.fd_size }}
      PAYLOAD_BASE: ${{ github.event.inputs.payload_base }}
    steps:
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev iasl nasm acpica-tools \
            python3 python3-venv python3-pip python3-dev \
            gcc-aarch64-linux-gnu

      - name: hackios uefi port (patch + files)
        run: git clone --depth 1 https://github.com/oosexgang/hackios-xnu-kernel.git hackios

      - name: Mu-Silicium at the pinned commit
        run: |
          BASE=$(tr -d ' \n' < hackios/uefi/BASE)
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          git clone https://github.com/Project-Silicium/Mu-Silicium.git Mu-Silicium
          git -C Mu-Silicium checkout "$BASE"
          git -C Mu-Silicium submodule update --init --recursive

      - name: apply the HackiOS changes
        run: |
          git -C Mu-Silicium apply --whitespace=nowarn "$GITHUB_WORKSPACE/hackios/uefi/mu-silicium.patch"
          cp -r hackios/uefi/files/. Mu-Silicium/
          grep -c XNUP Mu-Silicium/BootShim/BootShim.S
          test -f Mu-Silicium/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/XnuLoader.c
          test -d Mu-Silicium/Platforms/Xiaomi/marblePkg

      - name: mu_nasm without Mono
        run: |
          D=Mu-Silicium/Mu_Basecore/BaseTools/Bin/mu_nasm_extdep
          mkdir -p "$D/Linux-x86-64"
          echo 'version: 20016.1.1' > "$D/extdep_state.yaml"
          ln -sf /usr/bin/nasm "$D/Linux-x86-64/nasm"
          ln -sf /usr/bin/ndisasm "$D/Linux-x86-64/ndisasm"

      - name: build the FD
        run: |
          python3 -m venv venv
          venv/bin/pip install -q --upgrade pip
          venv/bin/pip install -q -r Mu-Silicium/pip-requirements.txt
          cd Mu-Silicium
          source ../venv/bin/activate
          python3 build_uefi.py -d marble -r RELEASE

      - name: build the boot shim for marble's addresses
        run: |
          make -C Mu-Silicium/BootShim REQUIRES_KERNEL_HEADER=1 \
            FD_BASE="$FD_BASE" FD_SIZE="$FD_SIZE" \
            CFLAGS="--target=aarch64-linux-gnu -DPAYLOAD_BASE=$PAYLOAD_BASE"
          ls -l Mu-Silicium/BootShim/BootShim.bin

      - name: check sizes
        run: |
          FD=Mu-Silicium/Build/marblePkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
          ls -l "$FD" Mu-Silicium/BootShim/BootShim.bin
          python3 - "$FD" "$FD_SIZE" <<'PY'
          import os, sys
          size, want = os.path.getsize(sys.argv[1]), int(sys.argv[2], 0)
          print(f"FD {size} bytes, expected {want}")
          sys.exit(0 if size == want else 1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: marble-uefi
          if-no-files-found: error
          path: |
            Mu-Silicium/Build/marblePkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
            Mu-Silicium/BootShim/BootShim.bin
