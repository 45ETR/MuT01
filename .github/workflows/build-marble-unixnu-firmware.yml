name: build-marble-unixnu-firmware

# Builds a SILICIUM_UEFI.fd for marble that actually contains UniXNU,
# UniXNUDxe, UniXNURamDiskDxe and DarwinBoot, so the boot manager can read
# EFI/UniXNU/unixnu.toml and hand over to XNU.
#
# The Coolapk Mu-marble.img firmware carries only UniXNU + UniXNUDxe and has
# neither the ram disk driver nor DarwinBoot, hence no payload can ever load.

on:
  workflow_dispatch:
    inputs:
      target:
        description: EDK2 build target
        required: false
        default: RELEASE
        type: choice
        options:
          - RELEASE
          - DEBUG

permissions:
  contents: read

env:
  MARBLE_TGZ_BASE64: 

jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU

      - name: Checkout uefi-sheng
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng

      - name: Checkout Mu_Basecore
        run: git -C uefi-sheng submodule update --init --recursive --depth 1 -- Mu_Basecore

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev nasm iasl acpica-tools pkg-config \
            gcc-aarch64-linux-gnu llvm lld clang mtools
          # Ubuntu ships the LLVM tools versioned (llvm-lib-14, lld-link-14); EDK2
          # CLANGPDB looks for the unversioned names.
          for tool in clang llvm-lib llvm-rc llvm-objcopy llvm-nm llvm-ar llvm-strip lld-link ld.lld; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              src=$(ls /usr/bin/"$tool"-* 2>/dev/null | sort -V | tail -n 1)
              if [ -n "$src" ]; then
                sudo ln -sf "$src" "/usr/local/bin/$tool"
              fi
            fi
          done
          for tool in clang llvm-lib llvm-rc lld-link; do
            printf '%s -> %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done
          clang --version
          ld.lld --version

      - name: Install EDK2 python requirements
        run: |
          if [ -f uefi-sheng/pip-requirements.txt ]; then
            python3 -m pip install --disable-pip-version-check -r uefi-sheng/pip-requirements.txt
          fi

      - name: Prepare marble repositories
        run: |
          python3 - <<'PY'
          import base64, io, os, tarfile
          data = base64.b64decode(os.environ['MARBLE_TGZ_BASE64'])
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as tf:
              tf.extractall('marble')
          PY
          for d in marble/device marble/soc; do
            git -C "$d" init -q -b main
            git -C "$d" add -A
            git -C "$d" -c user.email=ci@unixnu -c user.name=ci commit -qm ci
          done
          SOC_SHA=$(git -C marble/soc rev-parse HEAD)
          sed -i "s|git = \".*\"|git = \"file://$PWD/marble/soc\"|; s|commit = \".*\"|commit = \"$SOC_SHA\"|" marble/device/feeds.toml
          echo "SOC_SHA=$SOC_SHA"
          cat marble/device/feeds.toml

      - name: Resolve the configuration
        working-directory: UniXNU
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/marble/device
        run: |
          ./unixnu defconfig marble_defconfig

      - name: Fetch sources
        working-directory: UniXNU
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/marble/device
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./unixnu fetch
          ./unixnu status --json | tail -n 40

      - name: Patch marblePkg
        working-directory: ${{ github.workspace }}
        run: python3 marble/fw-patch.py

      - name: Build firmware
        working-directory: UniXNU
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/marble/device
          UNIXNU_EDK2: ${{ github.workspace }}/uefi-sheng/Mu_Basecore
        run: |
          ./unixnu build firmware --uefi ../uefi-sheng --edk2 ../uefi-sheng/Mu_Basecore --target ${{ inputs.target }} -j 4

      - name: Show build logs on failure
        if: failure()
        run: |
          set +e
          ls -l UniXNU/out/marble/*/marble/logs/ 2>/dev/null
          for f in UniXNU/out/marble/*/marble/logs/*.log; do
            [ -f "$f" ] || continue
            echo "================ $f ================"
            case "$(basename "$f")" in
              firmware.log|basetools.log)
                echo "---- errors ----"
                grep -n -i -E "error|failed|not found|No such file|not enough|overflow" "$f" | head -60
                echo "---- tail 80 ----"
                tail -n 80 "$f"
                ;;
              *)
                grep -n -i -E "error|failed|not found|No such file" "$f" | head -20
                tail -n 20 "$f"
                ;;
            esac
          done

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          FD="uefi-sheng/Build/marblePkg/${{ inputs.target }}_CLANGPDB/FV/SILICIUM_UEFI.fd"
          if [ -f "$FD" ]; then
            cp -v "$FD" artifacts/SILICIUM_UEFI-marble.fd
            ls -l artifacts/SILICIUM_UEFI-marble.fd
            sha256sum artifacts/SILICIUM_UEFI-marble.fd
          else
            echo "::warning::no FD was produced"
            find uefi-sheng/Build -name '*.fd' -maxdepth 6 2>/dev/null || true
          fi
          find UniXNU/out -name '*.log' -exec cp -v {} artifacts/ \; 2>/dev/null || true
          ls -l artifacts | head -60

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marble-firmware-${{ github.run_number }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "## marble UniXNU firmware"
            echo
            echo "- target: \`${{ inputs.target }}\`"
            echo "- FD:"
            ls -l artifacts/SILICIUM_UEFI-marble.fd 2>/dev/null || echo '  missing'
          } >> "$GITHUB_STEP_SUMMARY"
