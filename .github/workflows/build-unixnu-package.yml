# Build the marble UEFI with UniXNU's boot manager, so the phone can run the UniXNU flow instead of
# HackiOS's loader.
#
# Same base as build-marble-uefi.yml (the HackiOS-patched marblePkg that already produces a working
# 3 MiB FD), plus the four packages UniXNUPkg/DarwinBoot need:
#   DSC [Components]     UniXNU.inf, UniXNUDxe.inf, UniXNURamDiskDxe.inf, DarwinBoot.inf
#   DSC [LibraryClasses] UniXNULib, FdtLib
#   FDF [FV.FvMain]      the same four INFs
#   PACKAGES_PATH        the UniXNU checkout's package/ and drivers/DarwinBoot/
name: build-unixnu-firmware

on:
  workflow_dispatch:
    inputs:
      fd_base:
        description: 'FD_BASE (marble: 0xA7100000)'
        default: '0xA7100000'
      fd_size:
        description: 'FD_SIZE (marble: 0x300000)'
        default: '0x300000'
      payload_base:
        description: 'PAYLOAD_BASE (64 KiB aligned)'
        default: '0xAA000000'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      FD_BASE: ${{ github.event.inputs.fd_base }}
      FD_SIZE: ${{ github.event.inputs.fd_size }}
      PAYLOAD_BASE: ${{ github.event.inputs.payload_base }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev iasl nasm acpica-tools llvm \
            python3 python3-venv python3-pip python3-dev \
            gcc-aarch64-linux-gnu

      - name: hackios uefi port (the marble platform lives there)
        run: git clone --depth 1 https://github.com/oosexgang/hackios-xnu-kernel.git hackios

      - name: Mu-Silicium at the pinned commit
        run: |
          BASE=$(tr -d ' \n' < hackios/uefi/BASE)
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          git clone https://github.com/Project-Silicium/Mu-Silicium.git Mu-Silicium
          git -C Mu-Silicium checkout "$BASE"
          git -C Mu-Silicium submodule update --init --recursive

      - name: apply the HackiOS changes
        run: |
          git -C Mu-Silicium apply --whitespace=nowarn "$GITHUB_WORKSPACE/hackios/uefi/mu-silicium.patch"
          cp -r hackios/uefi/files/. Mu-Silicium/
          test -d Mu-Silicium/Platforms/Xiaomi/marblePkg
          test -f Mu-Silicium/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/XnuLoader.c

      - name: point the XnuLoader hook at marble's PAYLOAD_BASE
        run: |
          H=Mu-Silicium/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/XnuLoader.h
          sed -i 's|^#define XNU_PAYLOAD_BASE .*|#define XNU_PAYLOAD_BASE      0xAA000000ULL|' "$H"
          grep -n 'XNU_PAYLOAD_BASE' "$H"

      - name: comment out the marble ACPI table references
        run: |
          for f in $(grep -rl 'marble/AcpiTables\.inf' Mu-Silicium/Platforms/Xiaomi/marblePkg); do
            sed -i '/marble\/AcpiTables\.inf/{/^[[:space:]]*#/!s|^|# |}' "$f"
          done
          grep -rn 'AcpiTables' Mu-Silicium/Platforms/Xiaomi/marblePkg || true

      - name: UniXNU packages (package/ and DarwinBoot only)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/UniXNU/UniXNU.git UniXNU
          git -C UniXNU sparse-checkout init --cone
          git -C UniXNU sparse-checkout set package drivers/DarwinBoot
          git -C UniXNU checkout
          git -C UniXNU submodule update --init --depth 1 drivers/DarwinBoot
          echo "--- package ---";      ls UniXNU/package | head -20
          echo "--- DarwinBoot ---";   ls UniXNU/drivers/DarwinBoot | head -20
          find UniXNU -maxdepth 3 -name '*.dec' | head -10
          find UniXNU -name 'DarwinBoot.inf' | head -5

      - name: add the packages to marble.dsc and marble.fdf
        run: |
          set -e
          M=Mu-Silicium/Platforms/Xiaomi/marblePkg
          DSC=$M/marble.dsc
          FDF=$M/marble.fdf

          # [LibraryClasses] first, so the component entries can use them
          grep -q 'UniXNULib|' "$DSC" || \
            sed -i '/^\[LibraryClasses\]/a\  UniXNULib|UniXNUPkg/Library/UniXNULib/UniXNULib.inf' "$DSC"
          grep -q 'FdtLib|' "$DSC" || \
            sed -i '/^\[LibraryClasses\]/a\  FdtLib|MdePkg/Library/BaseFdtLib/BaseFdtLib.inf' "$DSC"

          # [Components]
          grep -q 'UniXNU/UniXNU.inf' "$DSC" || \
            sed -i '/^\[Components\]/a\  UniXNUPkg/Application/UniXNU/UniXNU.inf' "$DSC"
          grep -q 'UniXNUDxe.inf' "$DSC" || \
            sed -i '/^\[Components\]/a\  UniXNUPkg/Driver/UniXNUDxe/UniXNUDxe.inf' "$DSC"
          grep -q 'UniXNURamDiskDxe.inf' "$DSC" || \
            sed -i '/^\[Components\]/a\  UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe.inf' "$DSC"
          grep -q 'DarwinBoot.inf' "$DSC" || \
            sed -i '/^\[Components\]/a\  DarwinBootPkg/Driver/DarwinBoot.inf' "$DSC"

          # FvMain is the volume that ends up inside the FD
          grep -q 'UniXNU/UniXNU.inf' "$FDF" || \
            sed -i '/^\[FV.FvMain\]/a\  INF UniXNUPkg/Application/UniXNU/UniXNU.inf' "$FDF"
          grep -q 'INF UniXNUPkg/Driver/UniXNUDxe' "$FDF" || \
            sed -i '/^\[FV.FvMain\]/a\  INF UniXNUPkg/Driver/UniXNUDxe/UniXNUDxe.inf' "$FDF"
          grep -q 'INF UniXNUPkg/Driver/UniXNURamDiskDxe' "$FDF" || \
            sed -i '/^\[FV.FvMain\]/a\  INF UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe.inf' "$FDF"
          grep -q 'INF DarwinBootPkg/Driver/DarwinBoot' "$FDF" || \
            sed -i '/^\[FV.FvMain\]/a\  INF DarwinBootPkg/Driver/DarwinBoot.inf' "$FDF"

          echo "===== DSC [Components] head ====="; sed -n '/^\[Components\]/,+10p' "$DSC"
          echo "===== DSC LibraryClasses hits ====="; grep -n 'UniXNULib\|FdtLib' "$DSC"
          echo "===== FDF FvMain head ====="; sed -n '/^\[FV.FvMain\]/,+12p' "$FDF"

      - name: mu_nasm without Mono
        run: |
          D=Mu-Silicium/Mu_Basecore/BaseTools/Bin/mu_nasm_extdep
          mkdir -p "$D/Linux-x86-64"
          echo 'version: 20016.1.1' > "$D/extdep_state.yaml"
          ln -sf /usr/bin/nasm "$D/Linux-x86-64/nasm"
          ln -sf /usr/bin/ndisasm "$D/Linux-x86-64/ndisasm"

      - name: build the FD with UniXNU packages on the search path
        run: |
          # where the packages need to be visible from: the directory that CONTAINS UniXNUPkg, and the
          # one that contains DarwinBootPkg
          if [ -d UniXNU/package/UniXNUPkg ]; then PKGROOT=$PWD/UniXNU/package; else PKGROOT=$PWD/UniXNU; fi
          DBPKG=$(dirname "$(find UniXNU/drivers/DarwinBoot -name DarwinBoot.inf | head -1)")
          DBPKG=${DBPKG%/Driver}
          echo "PKGROOT=$PKGROOT"; echo "DBPKG=$DBPKG"
          test -d "$PKGROOT/UniXNUPkg" ; test -d "$DBPKG/DarwinBootPkg"
          echo "PACKAGES_PATH=$PKGROOT:$DBPKG:$PWD/Mu-Silicium" >> "$GITHUB_ENV"

          python3 -m venv --clear venv
          venv/bin/python -c "import tomllib"
          venv/bin/pip install -q --upgrade pip
          venv/bin/pip install -q -r Mu-Silicium/pip-requirements.txt
          cd Mu-Silicium
          ../venv/bin/python build_uefi.py -d marble -r RELEASE 2>&1 | tail -60
          ls -l Build/marblePkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd

      - name: build the boot shim for marble's addresses
        run: |
          rm -f Mu-Silicium/BootShim/BootShim.elf Mu-Silicium/BootShim/BootShim.bin
          make -C Mu-Silicium/BootShim REQUIRES_KERNEL_HEADER=1 \
            FD_BASE="$FD_BASE" FD_SIZE="$FD_SIZE" \
            CFLAGS="--target=aarch64-linux-gnu -DPAYLOAD_BASE=$PAYLOAD_BASE"
          ls -l Mu-Silicium/BootShim/BootShim.bin

      - name: check sizes
        run: |
          FD=Mu-Silicium/Build/marblePkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
          ls -l "$FD" Mu-Silicium/BootShim/BootShim.bin
          python3 - "$FD" "$FD_SIZE" <<'PY'
          import os, sys
          size, want = os.path.getsize(sys.argv[1]), int(sys.argv[2], 0)
          print(f"FD {size} bytes, expected {want}")
          sys.exit(0 if size == want else 1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: unixnu-marble-uefi
          if-no-files-found: error
          path: |
            Mu-Silicium/Build/marblePkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
            Mu-Silicium/BootShim/BootShim.bin
