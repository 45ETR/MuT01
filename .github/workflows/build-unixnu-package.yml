# Build UniXNU's UEFI packages (UniXNU.efi, UniXNUDxe, DarwinBoot ...) for marble on GitHub runners.
#
# Why CI: `./unixnu build package` fetches mu_basecore, Mu, edk2 and the component submodules; from
# some networks that takes hours, while the runner reaches GitHub directly.
#
# The marble device repository and the sm7475 SoC repository are embedded in this file as base64 and
# written out before the build, so uploading this single workflow is enough.
#
# What it does:
#   1. clones UniXNU with its component submodules
#   2. writes unixnu/UniXNU-marble and unixnu/UniXNU-sm7475-common, makes them git repositories and
#      points the SoC feed at the local checkout with a file:// URL
#   3. ./unixnu defconfig marble_defconfig -D ../UniXNU-marble
#   4. ./unixnu tree && ./unixnu build package
#   5. uploads every .efi and .a it produced
name: build-unixnu-package

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates python3 python3-venv python3-pip \
            nasm acpica-tools uuid-dev zlib1g-dev libssl-dev pkg-config \
            clang lld llvm

      - name: UniXNU, with its component submodules
        run: |
          git clone --recurse-submodules --depth 1 https://github.com/UniXNU/UniXNU.git unixnu/UniXNU
          git -C unixnu/UniXNU submodule status | head -30
      - name: write the marble device and sm7475 SoC repositories
        run: |
          # The files are embedded here (base64) so the job needs nothing from this repository.
          # After the port stabilises they belong in their own repositories and feeds.toml should
          # point at them instead.
          mkdir -p unixnu/UniXNU-marble
          printf '%s' '' | base64 -d > unixnu/UniXNU-marble/board.toml
          printf '%s' '' | base64 -d > unixnu/UniXNU-marble/feeds.toml
          mkdir -p unixnu/UniXNU-marble/configs
          printf '%s' '' | base64 -d > unixnu/UniXNU-marble/configs/marble_defconfig
          mkdir -p unixnu/UniXNU-marble/dts
          printf '%s' '' | base64 -d > unixnu/UniXNU-marble/dts/marble.dts
          mkdir -p unixnu/UniXNU-sm7475-common
          printf '%s' '' | base64 -d > unixnu/UniXNU-sm7475-common/soc.toml
          mkdir -p unixnu/UniXNU-sm7475-common/configs
          printf '%s' '' | base64 -d > unixnu/UniXNU-sm7475-common/configs/sm7475.config
          mkdir -p unixnu/UniXNU-sm7475-common/dts
          printf '%s' '' | base64 -d > unixnu/UniXNU-sm7475-common/dts/sm7475.dtsi
          mkdir -p unixnu/UniXNU-sm7475-common/patches/xnu
          printf '%s' '' | base64 -d > unixnu/UniXNU-sm7475-common/patches/xnu/series
          mkdir -p unixnu/UniXNU-sm7475-common/kits
          printf '%s' '' | base64 -d > unixnu/UniXNU-sm7475-common/kits/README.md

      - name: wire the marble repositories as local feeds
        run: |
          set -e
          DEV=$PWD/unixnu/UniXNU-marble
          SOC=$PWD/unixnu/UniXNU-sm7475-common
          test -f "$DEV/board.toml"
          test -f "$SOC/soc.toml"

          # feeds.toml wants a git revision, so make both directories repositories
          for d in "$SOC" "$DEV"; do
            if [ ! -d "$d/.git" ]; then
              git -C "$d" init -q -b main
              git -C "$d" add -A
              git -C "$d" -c user.email=ci@example.invalid -c user.name=ci commit -qm "ci snapshot"
            fi
          done

          COMMIT=$(git -C "$SOC" rev-parse HEAD)
          printf '[[source]]\nkind = "soc"\nname = "sm7475"\ngit = "file://%s"\ncommit = "%s"\n' \
            "$SOC" "$COMMIT" > "$DEV/feeds.toml"
          cat "$DEV/feeds.toml"

      - name: configure
        run: |
          cd unixnu/UniXNU
          ./unixnu defconfig marble_defconfig -D ../UniXNU-marble
          ./unixnu status --json | head -100

      - name: build the packages
        run: |
          cd unixnu/UniXNU
          ./unixnu tree
          ./unixnu build package > /tmp/pkg.log 2>&1 || true
          echo "===== tail of the package build ====="
          tail -70 /tmp/pkg.log
          echo "===== what was produced ====="
          find out/marble -type f \( -name '*.efi' -o -name '*.a' \) -printf '%p %s\n' 2>/dev/null | head -50
          find out/marble -type f -name '*.efi' | grep -q . || { echo "no .efi produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: unixnu-package-marble
          if-no-files-found: error
          path: |
            unixnu/UniXNU/out/marble/**/*.efi
            unixnu/UniXNU/out/marble/**/*.a
