# Build the marble XNU kernel on GitHub's runners, so the 200 MB Linux toolchain never crosses your link.
#
# What it does:
#   - installs theos + the prebuilt Linux iOS toolchain + iPhoneOS16.5.sdk (all at runner speed)
#   - clones hackios-xnu-kernel
#   - if this repository has marble/redwood_goodix.c, it replaces the stock touch driver with it
#   - xnu/apply.sh -> xnu-deps/setup.sh -> xnu-build.sh
#   - uploads mach.development.bcm2837 (~15 MB)
#
# How to use: put this file at .github/workflows/build-marble-kernel.yml in your CI repo
# (the same one that built the UEFI), commit the touch driver as marble/redwood_goodix.c, and run it.
name: build-marble-kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool bison flex m4 perl \
            python3 python3-pip python3-venv libtinfo5 libtinfo6 libncurses5 libxml2 \
            libbsd-dev uuid-dev libelf-dev libcap-dev \
            zip rsync curl xz-utils libssl-dev pkg-config zlib1g-dev clang lld llvm

      - name: theos + toolchain + SDK
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/toolchain" "$HOME/theos/sdks"
          curl -L --retry 5 --retry-delay 3 -o /tmp/tc.tar.xz \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz
          tar -xJf /tmp/tc.tar.xz -C "$HOME/theos/toolchain/"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
          mv /tmp/sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/"
          test -x "$HOME/theos/toolchain/linux/iphone/bin/ld"
          test -d "$HOME/theos/sdks/iPhoneOS16.5.sdk/usr/include"
          echo "theos: $($HOME/theos/toolchain/linux/iphone/bin/clang --version | head -1)"

      - name: hackios source
        run: git clone --depth 1 https://github.com/oosexgang/hackios-xnu-kernel.git hackios

      - name: glibc < 2.38 needs strlcat/strlcpy for the host tools
        run: |
          # hackios was developed on Arch (glibc >= 2.38, which has strlcat/strlcpy in libc).
          # Ubuntu 22.04 has glibc 2.35, so SETUP/replacecontents fails to link with
          # "undefined reference to strlcat". hostcompat.h is force-included into every host tool.
          # The snippet is base64 so no line of C can break this YAML block scalar.
          echo '' | base64 -d >> hackios/xnu-deps/hostinc/hostcompat.h
          tail -6 hackios/xnu-deps/hostinc/hostcompat.h

      - name: use the marble touch driver from this repository, if present
        run: |
          if [ -f marble/redwood_goodix.c ]; then
            cp marble/redwood_goodix.c hackios/xnu/files/bsd/dev/redwood_goodix.c
            grep -n 'TLMM_PHYS\|PIN_INT \|SE_PHYS' hackios/xnu/files/bsd/dev/redwood_goodix.c | head
          else
            echo "marble/redwood_goodix.c not in the repo: building the stock redwood driver"
          fi

      - name: use the theos Apple clang, like the HackiOS developers do
        run: |
          # xnu-clang execs /usr/bin/clang (Ubuntu's LLVM build). A kernel cross-built for XNU's early
          # boot with a different compiler hangs before its console exists, so point the wrapper at the
          # Apple clang that comes with the theos toolchain we already downloaded.
          test -x "$HOME/theos/toolchain/linux/iphone/bin/clang"
          sed -i 's|exec /usr/bin/\$drv|exec "${THEOS:-$HOME/theos}/toolchain/linux/iphone/bin/$drv"|' \
            hackios/xnu-deps/host/bin/xnu-clang

          # that clang is version 11: --ld-path= arrived in clang 12. In clang 11 the linker is picked
          # with -B<dir> (a directory containing `ld`), so link cctools' ld64 as host/bin/ld and use -B.
          ln -sf ld64 hackios/xnu-deps/host/bin/ld
          perl -0pi -e 's|--ld-path="\$HB/ld64"|-B"\$HB"|' hackios/xnu-deps/host/bin/xnu-clang
          grep -n 'exec\|-B' hackios/xnu-deps/host/bin/xnu-clang
          ls -l hackios/xnu-deps/host/bin/ld
          "$HOME/theos/toolchain/linux/iphone/bin/clang" --version | head -2

      - name: teach xnu-clang the flags of a newer clang
        run: |
          # theos' toolchain is clang 11; XNU 8796 is written for Apple clang 15. The wrapper drops
          # arguments the compiler would refuse, so extend its list with the ones clang 11 lacks:
          #   -ftrivial-auto-var-init=*     clang 12 (needs an opt-in flag as well)
          #   -fsanitize-ignorelist=*       clang 12 (was -fsanitize-blacklist=*)
          #   -fsanitize-blacklist=*        the old name, harmless to drop too
          #   -moutline-atomics             clang 12
          #   -fno-experimental-...         several were renamed around clang 12
          perl -0pi -e 's/\Q    -fapple-kext-vtable-verify\E/    -ftrivial-auto-var-init=*|-fsanitize-ignorelist=*|-fsanitize-blacklist=*|-moutline-atomics|-fno-outline-atomics|-fapple-kext-vtable-verify/' \
            hackios/xnu-deps/host/bin/xnu-clang
          grep -n 'ftrivial-auto-var-init' hackios/xnu-deps/host/bin/xnu-clang

      - name: apply the XNU patches and build
        run: |
          cd hackios
          xnu/apply.sh
          if ! xnu-deps/setup.sh; then
            echo "===== setup failed: every error-ish line of exporthdrs.log ====="
            grep -niE 'error|fatal|cannot find|undefined reference|no such file' \
              xnu-deps/exporthdrs.log 2>/dev/null | tail -40 || true
            echo "===== context around the first error ====="
            grep -niE -B8 -A12 'error|fatal|cannot find|undefined reference|no such file' \
              xnu-deps/exporthdrs.log 2>/dev/null | head -160 || true
            echo "===== last 60 lines of exporthdrs.log ====="
            tail -60 xnu-deps/exporthdrs.log 2>/dev/null || echo "(no exporthdrs.log)"
            exit 1
          fi
          # the export check after linking is expected to fail (xnu/README.md); judge by the file
          ./xnu-build.sh -j"$(nproc)" -k || true
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          if [ ! -s "$K" ]; then
            echo "===== no kernel; last 80 lines of the build log ====="
            tail -80 xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/*.log 2>/dev/null || true
            tail -80 "$(ls -t xnu-src/xnu-8796.121.2/BUILD/*.log 2>/dev/null | head -1)" 2>/dev/null || true
            exit 1
          fi
          ls -l "$K"

      - uses: actions/upload-artifact@v4
        with:
          name: marble-kernel
          if-no-files-found: error
          path: hackios/xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
