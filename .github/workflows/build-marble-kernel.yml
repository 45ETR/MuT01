# Build the marble XNU kernel on GitHub runners: the 200 MB Linux toolchain and the SDK never cross
# your own link, only the ~15 MB kernel comes back.
#
# The kernel is built the way xnu/README.md says the developers build it: stock (new) clang, not the
# clang 11 that ships inside the theos toolchain. clang 14 and clang 11 produced kernels that hang
# before their console exists; README says it was tested with clang 22.
#
# Put this file at .github/workflows/build-marble-kernel.yml in the CI repo. If the repo also has
# marble/redwood_goodix.c, it replaces the stock touch driver before the build.
name: build-marble-kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool bison flex m4 perl \
            python3 python3-pip python3-venv libtinfo5 libtinfo6 libncurses5 libxml2 \
            libbsd-dev uuid-dev libelf-dev libcap-dev \
            zip rsync curl wget xz-utils libssl-dev pkg-config zlib1g-dev lsb-release

      - name: clang 18 from apt.llvm.org
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18
          # put it first in PATH so both HOST_CC and the xnu-clang wrapper use it
          sudo ln -sf /usr/bin/clang-18    /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18  /usr/local/bin/clang++
          clang --version | head -2

      - name: theos, its cctools (ld64) and the SDK
        run: |
          # theos itself is only needed for toolchain/linux/iphone/bin/ld (cctools ld64) and the SDK
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/toolchain" "$HOME/theos/sdks"
          curl -L --retry 5 --retry-delay 3 -o /tmp/tc.tar.xz \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz
          tar -xJf /tmp/tc.tar.xz -C "$HOME/theos/toolchain/"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
          mv /tmp/sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/"
          test -x "$HOME/theos/toolchain/linux/iphone/bin/ld"
          test -d "$HOME/theos/sdks/iPhoneOS16.5.sdk/usr/include"

      - name: hackios source
        run: git clone --depth 1 https://github.com/oosexgang/hackios-xnu-kernel.git hackios

      - name: glibc < 2.38 needs strlcat/strlcpy for the host tools
        run: |
          # Ubuntu 22.04 has glibc 2.35; the XNU SETUP tools use strlcat/strlcpy, which glibc only grew
          # in 2.38 (the developers were on Arch). hostcompat.h is force-included into every host tool.
          echo '' \
            | base64 -d >> hackios/xnu-deps/hostinc/hostcompat.h
          tail -3 hackios/xnu-deps/hostinc/hostcompat.h

      - name: use the marble touch driver from this repository, if present
        run: |
          if [ -f marble/redwood_goodix.c ]; then
            cp marble/redwood_goodix.c hackios/xnu/files/bsd/dev/redwood_goodix.c
            grep -n 'TLMM_PHYS\|PIN_INT \|SE_PHYS' hackios/xnu/files/bsd/dev/redwood_goodix.c | head
          else
            echo "marble/redwood_goodix.c not in the repo: building the stock redwood driver"
          fi

      - name: teach xnu-clang where clang and ld64 are
        run: |
          W=hackios/xnu-deps/host/bin/xnu-clang
          # 1) the wrapper hardcodes /usr/bin/clang; use the clang 18 we put in /usr/local/bin
          sed -i 's|exec /usr/bin/\$drv|exec /usr/local/bin/$drv|' "$W"
          # 2) cctools ld64 as host/bin/ld, found through -B (works on every clang version)
          ln -sf ld64 hackios/xnu-deps/host/bin/ld
          perl -0pi -e 's|--ld-path="\$HB/ld64"|-B"\$HB"|' "$W"
          # 3) flags clang refuses: dropped, like the wrapper already does for other Apple-only ones
          perl -0pi -e 's/\Q    -fapple-kext-vtable-verify\E/    -ftrivial-auto-var-init=*|-fsanitize-ignorelist=*|-fsanitize-blacklist=*|-moutline-atomics|-fno-outline-atomics|-fapple-kext-vtable-verify/' "$W"
          grep -n 'exec\|-B\|ftrivial' "$W" | head

      - name: apply the XNU patches and build
        run: |
          cd hackios
          xnu/apply.sh
          if ! xnu-deps/setup.sh; then
            echo "===== setup failed: error-ish lines of exporthdrs.log ====="
            grep -niE 'error|fatal|cannot find|undefined reference|no such file|unrecognized|unsupported|not found' \
              xnu-deps/exporthdrs.log 2>/dev/null | tail -40 || true
            echo "===== context around the first error ====="
            grep -niE -B10 -A14 'error|fatal|cannot find|undefined reference|no such file|unrecognized|unsupported' \
              xnu-deps/exporthdrs.log 2>/dev/null | head -200 || true
            echo "===== last 120 lines of exporthdrs.log (always, so nothing is hidden) ====="
            tail -120 xnu-deps/exporthdrs.log 2>/dev/null || echo "(no exporthdrs.log)"
            exit 1
          fi
          # xnu/README.md: the build always ends with the check_all_exports error; the kernel is linked
          # and usable by then, so judge by the file, not by make's exit status.
          ./xnu-build.sh -j"$(nproc)" -k || true
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          if [ ! -s "$K" ]; then
            echo "===== no kernel; last 80 lines of the build log ====="
            tail -80 "$(ls -t xnu-src/xnu-8796.121.2/BUILD/*.log 2>/dev/null | head -1)" 2>/dev/null || true
            exit 1
          fi
          ls -l "$K"
          # the developers compared size with the working kernel (15623056 bytes); a big difference
          # means a different compiler or a broken link
          echo "size: $(stat -c %s "$K") (the working redwood kernel is 15623056)"

      - uses: actions/upload-artifact@v4
        with:
          name: marble-kernel
          if-no-files-found: error
          path: hackios/xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
