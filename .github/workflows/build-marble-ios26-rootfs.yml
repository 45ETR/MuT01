name: Build the iOS 26 root filesystem (23G90)

# Extracts the iOS 26.6.2 (23G90, iPhone 17: iPhone18,3) userland out of the IPSW on a macOS runner:
# the root filesystem and the OS cryptex are AEA encrypted, which only macOS can decrypt (aea + hdiutil).
# The result is uploaded as a few zstd tarballs for the marble port to consume.

on:
  workflow_dispatch:

env:
  IPSW_URL: https://updates.cdn-apple.com/2026SummerFCS/c2f9fa07-0acc-4038-99f4-d7a4b1ac9c06/iPhone18,3_26.6.2_23G90_Restore.ipsw
  IPSW_SIZE: "11481186987"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - name: Select Xcode
        run: |
          set -euo pipefail
          for c in "/Applications/Xcode_26.6.app" "/Applications/Xcode.app"; do
            if [ -d "$c" ]; then echo "DEVELOPER_DIR=$c/Contents/Developer" >> "$GITHUB_ENV"; break; fi
          done
          xcrun --sdk macosx --show-sdk-path >/dev/null

      - name: Check out the K90 tools
        uses: actions/checkout@v4
        with:
          repository: iola1999/hackios-redmi-k90-annibale
          ref: main
          path: work
          sparse-checkout: |
            tools
          sparse-checkout-cone-mode: true

      - name: Check out the K90 userland
        uses: actions/checkout@v4
        with:
          repository: iola1999/hackios-xnu-userland
          ref: k90-port
          path: userland-work
          sparse-checkout: |
            ios26
            ios165
            tools
          sparse-checkout-cone-mode: true

      - name: Lay the tree out the way fetch.sh expects it
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/ios26"
          rsync -a work/ "$HOME/ios26/"
          rsync -a userland-work/ "$HOME/ios26/userland/"
          ls -l "$HOME/ios26/tools/ipsw" "$HOME/ios26/userland/ios26"

      - name: Install tools
        run: |
          set -euxo pipefail
          brew install sevenzip zstd
          7zz | head -2
          # aea-key.py needs cryptography; Homebrew's python refuses a system-wide install (PEP 668), so
          # give it a venv and put that venv first in PATH (every later python3 must be this one).
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install --quiet --upgrade pip
          "$HOME/venv/bin/pip" install --quiet cryptography
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          "$HOME/venv/bin/python3" -c 'import cryptography; print("cryptography", cryptography.__version__)'
          aea 2>&1 | head -5 || true

      - name: Download the three disk images
        run: |
          set -euxo pipefail
          cd "$HOME/ios26"
          mkdir -p ipsw
          python3 tools/ipsw/fetch.py 094-96558-090.dmg.aea ipsw/os.dmg.aea       "$IPSW_URL" "$IPSW_SIZE"
          python3 tools/ipsw/fetch.py 094-95851-092.dmg.aea ipsw/systemos.dmg.aea "$IPSW_URL" "$IPSW_SIZE"
          python3 tools/ipsw/fetch.py 094-96441-094.dmg     ipsw/appos.dmg        "$IPSW_URL" "$IPSW_SIZE"
          ls -l ipsw

      - name: Decrypt the AEA images
        run: |
          set -euxo pipefail
          cd "$HOME/ios26"
          for n in os systemos; do
            key=$(python3 tools/ipsw/aea-key.py "ipsw/$n.dmg.aea")
            echo "the key of $n.dmg.aea: ${key:0:16}..."
            aea decrypt -i "ipsw/$n.dmg.aea" -o "ipsw/$n.dmg" -key-value "base64:$key"
          done
          ls -l ipsw

      - name: Lay out the userland
        run: |
          set -euxo pipefail
          cd "$HOME/ios26/userland/ios26"
          IPSW_DIR="$HOME/ios26/ipsw" bash ./fetch.sh
          echo "----- sizes (iOS 26 keeps the dyld cache outside the root dmg)"
          du -sh rootfs cryptex cryptex-app 23G90__iPhone18,3 || true
          echo "----- the two binaries that matter"
          ls -l rootfs/sbin/launchd rootfs/usr/lib/dyld || true
          echo "----- where the shared cache actually is"
          find . -maxdepth 7 -name 'dyld_shared_cache*' -print 2>/dev/null | head -20 || true
          du -sh ./*/System/Library/dyld 2>/dev/null || true
          echo "----- done"

      # Chunks go out as release assets: 2 GiB per asset is allowed there, and
      # the download is a plain URL instead of a zip-in-a-zip.
      - name: Trim the obvious bulk
        run: |
          set -euxo pipefail
          cd "$HOME/ios26/userland/ios26"
          echo "----- the root before trimming"
          du -sh rootfs/* 2>/dev/null | sort -h | tail -15 || true
          for p in Applications System/Library/Caches System/Library/Developer \
                   Library/Developer AppleInternal usr/share/doc; do
            [ -e "rootfs/$p" ] || continue
            echo "dropping rootfs/$p ($(du -sh "rootfs/$p" | cut -f1))"
            rm -rf "rootfs/$p"
          done
          find rootfs -maxdepth 8 -type d -name '*.symbols' -print -exec rm -rf {} + 2>/dev/null || true
          echo "----- the root after trimming"
          du -sh rootfs 23G90__iPhone18,3 cryptex cryptex-app || true

      - name: Pack it up into chunks
        run: |
          set -euxo pipefail
          cd "$HOME/ios26/userland/ios26"
          out="$GITHUB_WORKSPACE/out"
          mkdir -p "$out"
          for d in rootfs cryptex cryptex-app 23G90__iPhone18,3; do
            [ -d "$d" ] || { echo "skipping $d (absent)"; continue; }
            base=$(echo "$d" | tr -c 'A-Za-z0-9' '_')
            tar -cf - "$d" | zstd -T0 -3 -o "$out/$base.tar.zst"
            split -b 1900M -d -a 2 "$out/$base.tar.zst" "$out/$base.tar.zst.part"
            rm -f "$out/$base.tar.zst"
          done
          cp -a system.files system.manifest var.skel "$out/" 2>/dev/null || true
          cd "$out"
          ls -l
          ls -l > listing.txt
          if command -v sha256sum >/dev/null 2>&1; then HASH="sha256sum"; else HASH="shasum -a 256"; fi
          $HASH ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the chunks as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          tag="ios26-rootfs-23G90"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "iOS 26.6.2 (23G90) userland for marble" \
              --notes "Chunked rootfs for the marble XNU port: cat the .partNN files of one base name back together, then zstd -d."
          fi
          shopt -s nullglob
          for f in "$GITHUB_WORKSPACE"/out/*; do
            [ -f "$f" ] || continue
            echo "uploading $(basename "$f") ($(du -h "$f" | cut -f1))"
            gh release upload "$tag" "$f" --clobber
          done
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.size)"'
