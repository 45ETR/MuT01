name: marble UniXNU kernel

on:
  workflow_dispatch:
    inputs:
      steps:
        description: Steps to build
        type: choice
        options:
          - kernel
          - kernel payload
        default: kernel payload
      xcode:
        description: Xcode version of the macos-26 image (/Applications/Xcode_<version>.app)
        required: true
        default: "26.6"

permissions:
  contents: read

concurrency:
  group: marble-unixnu-kernel-${{ github.run_id }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  MARBLE_TGZ_BASE64: 

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      STEPS: ${{ inputs.steps }}
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: .
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Select Xcode
        run: |
          pick="/Applications/Xcode_${{ inputs.xcode }}.app"
          if [ ! -d "$pick" ]; then
            pick=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            echo "Xcode_${{ inputs.xcode }} is not on this image; falling back to $pick"
          fi
          if [ -z "$pick" ] || [ ! -d "$pick" ]; then
            echo "no Xcode installation found in /Applications" >&2
            ls -d /Applications/Xcode* 2>/dev/null >&2 || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$pick/Contents/Developer" >> "$GITHUB_ENV"
          echo "selected $pick"
          "$pick/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h "$GITHUB_WORKSPACE"

      - name: Materialize the marble device and sm7475 SoC repositories
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/marble"
          python3 - <<'PY'
          import base64, io, os, re, tarfile
          raw = os.environ['MARBLE_TGZ_BASE64']
          raw = raw.split(',', 1)[-1]
          raw = re.sub(r'[^A-Za-z0-9+/=]', '', raw) + '=' * (-len(raw) % 4)
          blob = base64.b64decode(raw)
          with tarfile.open(fileobj=io.BytesIO(blob), mode='r:gz') as archive:
              archive.extractall(os.environ['RUNNER_TEMP'] + '/marble')
          PY
          cd "$RUNNER_TEMP/marble/soc"
          git init -q -b main .
          git -c user.name=unixnu -c user.email=unixnu@localhost add -A
          git -c user.name=unixnu -c user.email=unixnu@localhost commit -q -m sm7475
          commit=$(git rev-parse HEAD)
          cd "$RUNNER_TEMP/marble/device"
          git init -q -b main .
          git -c user.name=unixnu -c user.email=unixnu@localhost add -A
          git -c user.name=unixnu -c user.email=unixnu@localhost commit -q -m marble
          sed -i.bak -e "s|^git = .*|git = \"file://$RUNNER_TEMP/marble/soc\"|" -e "s|^commit = .*|commit = \"$commit\"|" feeds.toml
          cat feeds.toml
          echo "UNIXNU_DEVICE=$RUNNER_TEMP/marble/device" >> "$GITHUB_ENV"

      - name: Resolve the configuration
        run: ./unixnu defconfig marble_defconfig

      - name: Fetch sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The module submodules (kits/XnuPrelink and friends) only exist after this step, and the OS profile
          # patch series references them, so the status report has to come after the fetch, not before it.
          ./unixnu fetch
          ./unixnu status --json | tail -n 40

      - name: Fetch the IPSW members
        run: ./unixnu ipsw fetch

      - name: Build the kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu build kernel

      - name: Build the payload
        if: contains(inputs.steps, 'payload')
        run: ./unixnu build payload

      - name: Surface the build diagnostics
        if: always()
        run: |
          set +e
          log=$(find out -name kernel.log -type f | head -1)
          echo "===== kernel log: $log"
          if [ -n "$log" ]; then
            echo "----- every error line"
            grep -n -E 'error:|Undefined symbols|ld: |linker command failed|fatal error' "$log" | head -60
            echo "----- first failure in context"
            line=$(grep -n -m1 -E 'Undefined symbols|linker command failed|ld: (duplicate|symbol)' "$log" | cut -d: -f1)
            if [ -n "$line" ]; then
              first=$(( line > 20 ? line - 20 : 1 ))
              sed -n "${first},$(( line + 45 ))p" "$log"
            else
              tail -40 "$log"
            fi
            echo "----- marble UFS lines"
            grep -n 'marble UFS' "$log" | head -20
          fi
          echo "===== UFS archive log"
          for file in $(find out -name 'archive-*marble-ufs*.log' -type f | head -3); do
            echo "--- $file"
            tail -30 "$file"
          done
          echo "===== prelink products"
          for directory in $(find out -type d -name xnu-prelink | head -2); do
            echo "--- $directory"
            ls -l "$directory" | head -30
          done
          echo done

      - name: Dump the original storage slots
        if: always()
        run: |
          set +e
          tree=$(find out -maxdepth 5 -type d -name tree | head -1)
          echo "tree: $tree"
          if [ -n "$tree" ] && [ -f "$tree/scripts/dump-storage-slots.py" ]; then
            cd "$tree" && python3 scripts/dump-storage-slots.py 2>&1 | head -220
          else
            echo "SLOTS: dump script not present in the tree"
          fi
          echo done

      - name: Collect the artifacts
        if: always()
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/artifacts"
          find out -name '*.log' -type f -exec cp -v {} "$RUNNER_TEMP/artifacts/" \;
          find out -name 'kernel.macho*' -type f -exec cp -v {} "$RUNNER_TEMP/artifacts/" \;
          find out -name '*.img' -type f -size -600M -exec cp -v {} "$RUNNER_TEMP/artifacts/" \;
          find out -name 'payload.json' -type f -exec cp -v {} "$RUNNER_TEMP/artifacts/" \;
          ls -l "$RUNNER_TEMP/artifacts" || true

      - name: Upload the artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marble-unixnu-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "## marble UniXNU: ${STEPS}"
            echo
            echo '```'
            ls -l "$RUNNER_TEMP/artifacts" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
