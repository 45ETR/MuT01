name: Build a writable APFS data volume for marble

# Our root image is made by mkapfs.py, which has no space manager, so APFS mounts it read-only.
# iOS needs a writable /private/var (fixup-mobile-tmp, keybag, usermanagerd, coredumps, swap files),
# and only macOS can create a real APFS container. This job makes one with hdiutil (which formats it
# properly), fills in the /private/var skeleton, copies the raw container out of the attached device
# and publishes it. The loader turns it into md1.

on:
  workflow_dispatch:
    inputs:
      size_mb:
        description: 'Size of the data volume in MB'
        required: false
        default: '1024'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Show the APFS tooling
        run: |
          set -euxo pipefail
          which hdiutil diskutil newfs_apfs
          hdiutil 2>&1 | head -5 || true
          newfs_apfs 2>&1 | head -25 || true

      - name: Create a blank writable APFS image
        run: |
          set -euxo pipefail
          SIZE_MB='${{ inputs.size_mb }}'
          [ -n "$SIZE_MB" ] || SIZE_MB=1024
          IMG="$RUNNER_TEMP/vol.dmg"
          rm -f "$IMG"
          # one shot: a read/write image formatted as APFS with a single volume named Data
          hdiutil create -size "${SIZE_MB}m" -fs APFS -volname Data -type UDIF -ov "$IMG"
          hdiutil imageinfo "$IMG" | sed -n '1,25p'
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: Fill in the /private/var skeleton
        run: |
          set -euxo pipefail
          IMG="$IMG"
          MNT="$RUNNER_TEMP/mnt"
          mkdir -p "$MNT"
          hdiutil attach "$IMG" -nobrowse -mountpoint "$MNT"
          sudo chown -R 0:0 "$MNT"
          for d in mobile mobile/Library mobile/Library/Caches mobile/Library/Preferences \
                   mobile/Media mobile/Documents mobile/Downloads \
                   db db/DarwinDirectory db/com.apple.xpc.launchd db/dslocal \
                   tmp logs Keychains folders preferences cores audit containers devices; do
            sudo mkdir -p "$MNT/$d"
          done
          sudo chown 501:501 "$MNT/mobile"
          sudo chown -R 501:501 "$MNT/mobile"
          sudo chmod 1777 "$MNT/tmp"
          sudo chmod 755 "$MNT"
          ls -la "$MNT" | head -25
          du -sh "$MNT" || true
          sync
          hdiutil detach "$MNT"
          diskutil list | tail -20

      - name: Copy the raw container out of the device
        run: |
          set -euxo pipefail
          IMG="$IMG"
          DEV=$(hdiutil attach -nomount -nobrowse "$IMG" | awk 'NR==1 {print $1}')
          echo "attached as $DEV"
          diskutil list "$DEV"
          RAW="$RUNNER_TEMP/data.raw"
          sudo dd if="$DEV" of="$RAW" bs=1m
          hdiutil detach "$DEV" -force || true
          ls -l "$RAW"
          # the first block must be an APFS container
          xxd -l 32 "$RAW"
          python3 -c "import struct;d=open('$RAW','rb').read(64);m,b,c=struct.unpack_from('<IIQ',d,32);print('nx_magic %#x block_size %d blocks %d total %.2f GiB' % (m,b,c,b*c/2**30));assert m==0x4253584e,'not an APFS container'"

      - name: Pack and publish the container
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          RAW="$RUNNER_TEMP/data.raw"
          out="$GITHUB_WORKSPACE/out"
          mkdir -p "$out"
          zstd -T0 -9 "$RAW" -o "$out/data.apfs.zst"
          split -b 900M -d -a 2 "$out/data.apfs.zst" "$out/data.apfs.zst.part"
          rm -f "$out/data.apfs.zst"
          cd "$out"
          ls -l
          if command -v sha256sum >/dev/null 2>&1; then HASH="sha256sum"; else HASH="shasum -a 256"; fi
          $HASH ./* > SHA256SUMS
          cat SHA256SUMS
          tag="ios26-apfs-data"
          if ! gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$tag" -R "$REPO" \
              --title "Writable APFS data volume for marble" \
              --notes "A raw APFS container with one volume for /private/var; cat data.apfs.zst.part* | zstd -d > data.raw"
          fi
          shopt -s nullglob
          for f in "$out"/*; do
            [ -f "$f" ] || continue
            echo "uploading $(basename "$f") ($(du -h "$f" | cut -f1))"
            gh release upload "$tag" "$f" -R "$REPO" --clobber
          done
          gh release view "$tag" -R "$REPO" --json assets --jq '.assets[] | "\(.name) \(.size)"'
