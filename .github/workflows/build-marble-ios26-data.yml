name: Build a writable APFS data volume for marble

# Our root image is made by mkapfs.py, which has no space manager, so APFS mounts it read-only.
# iOS needs a writable /private/var (fixup-mobile-tmp, keybag, usermanagerd, coredumps, swap files).
# The kernel mounts md1 there, and measurement showed it *does* mount - but read-only, because the
# volume carries no role ("the volume is iOS's own system or preboot volume" is one of the reasons
# apfs_write_volume_ok() reports EROFS).  So this job formats the container with newfs_apfs and gives
# the volume the Data role, then copies the raw container out of the (never mounted) block device.
# Keep it small: the loader only accepts a 57.6 MB payload, so md1 has to fit next to the kernel.

on:
  workflow_dispatch:
    inputs:
      size_mb:
        description: 'Size of the data volume in MB'
        required: false
        default: '24'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Show the APFS tooling
        run: |
          set -euxo pipefail
          which hdiutil diskutil newfs_apfs
          newfs_apfs 2>&1 | head -20 || true

      - name: Format a Data-role APFS container and copy it out
        run: |
          set -euxo pipefail
          SIZE_MB='${{ inputs.size_mb }}'
          [ -n "$SIZE_MB" ] || SIZE_MB=24
          IMG="$RUNNER_TEMP/vol.dmg"
          rm -f "$IMG"
          # A blank read/write image; the container is created by newfs_apfs, which can set the role.
          hdiutil create -size "${SIZE_MB}m" -layout NONE -type UDIF -ov "$IMG"
          DEV=$(hdiutil attach -nomount -nobrowse "$IMG" | awk 'NR==1 {print $1}')
          echo "attached as $DEV (not mounted)"
          diskutil list "$DEV" || true
          # Role D = Data.  Without a role the iOS apfs driver mounts the volume read-only.
          sudo newfs_apfs -v Data -r D "$DEV"
          N=${DEV#/dev/}
          RAW="$RUNNER_TEMP/data.raw"
          pick=""
          CAND_WHOLE="/dev/r${N}"
          CAND_S1="/dev/r${N}s1"
          for cand in "$CAND_WHOLE" "$CAND_S1"; do
            [ -e "$cand" ] || continue
            sudo dd if="$cand" of="$RAW" bs=1m status=none || true
            mag=$(xxd -p -l 4 -s 32 "$RAW" 2>/dev/null | head -1 || true)
            echo "candidate $cand -> magic $mag"
            if [ "$mag" = "4e585342" ]; then pick="$cand"; break; fi
          done
          if [ -z "$pick" ]; then
            echo "no APFS container on $DEV"
            sudo hexdump -C -n 128 "/dev/r$N" || true
            exit 1
          fi
          echo "copied from $pick"
          hdiutil detach "$DEV" -force || true
          ls -l "$RAW"
          xxd -l 48 "$RAW"
          python3 -c "import struct;d=open('$RAW','rb').read(64);m,b,c=struct.unpack_from('<IIQ',d,32);print('nx_magic %#x block_size %d blocks %d total %.2f MiB' % (m,b,c,b*c/2**20));assert m==0x4253584e,'not an APFS container'"

      - name: Pack and publish the container
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          RAW="$RUNNER_TEMP/data.raw"
          out="$GITHUB_WORKSPACE/out"
          mkdir -p "$out"
          zstd -T0 -9 "$RAW" -o "$out/data.apfs.zst"
          split -b 900M -d -a 2 "$out/data.apfs.zst" "$out/data.apfs.zst.part"
          rm -f "$out/data.apfs.zst"
          cd "$out"
          ls -l
          if command -v sha256sum >/dev/null 2>&1; then HASH="sha256sum"; else HASH="shasum -a 256"; fi
          $HASH ./* > SHA256SUMS
          cat SHA256SUMS
          tag="ios26-apfs-data"
          if ! gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$tag" -R "$REPO" \
              --title "Writable APFS data volume for marble" \
              --notes "A raw APFS container with one Data-role volume for /private/var; cat data.apfs.zst.part* | zstd -d > data.raw"
          fi
          shopt -s nullglob
          for f in "$out"/*; do
            [ -f "$f" ] || continue
            echo "uploading $(basename "$f") ($(du -h "$f" | cut -f1))"
            gh release upload "$tag" "$f" -R "$REPO" --clobber
          done
          gh release view "$tag" -R "$REPO" --json assets --jq '.assets[] | "\(.name) \(.size)"'
