name: build-marble-touch-kernel

# Builds yukoimi/hackios-marble's source kernel on a Linux runner, following the
# tree's own tools/marble-linux-build.sh recipe.
#
# The patches below go into xnu/files/ BEFORE `setup`, because setup is what copies
# those files into xnu-src/xnu-8796.121.2 (and the kernel step only runs xnu/apply.sh
# when that tree is missing, so patching afterwards would change nothing).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout the marble tree
        uses: actions/checkout@v4
        with:
          repository: yukoimi/hackios-marble
          path: marble

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl clang lld llvm python3 flex bison m4 \
            autoconf automake libtool pkg-config libxml2-dev libssl-dev \
            cmake ninja-build rsync zlib1g-dev libzstd-dev uuid-dev libbsd-dev gawk
          clang --version
          ld.lld --version

      - name: Patch the sources
        working-directory: marble
        run: |
          set -e
          python3 - <<'PY'
          import pathlib, shutil, sys

          # 1. The service stays ready once it has been started: runtime_inflight is 0
          #    whenever the GPU is idle, and that is exactly when a client asks.
          p = pathlib.Path('xnu/files/bsd/dev/marble_adreno.c')
          s = p.read_text()
          old = 'bool marble_gpu_ready(void)\n{return __atomic_load_n(&service_started,__ATOMIC_ACQUIRE) && __atomic_load_n(&runtime_inflight,__ATOMIC_ACQUIRE);}'
          new = ('bool marble_gpu_ready(void)\n'
                 '{return __atomic_load_n(&service_started,__ATOMIC_ACQUIRE) && !__atomic_load_n(&runtime_stop_requested,__ATOMIC_ACQUIRE);}')
          if old not in s:
              sys.exit('marble_gpu_ready: pattern not found')
          s = s.replace(old, new, 1)

          # 2. The ladder runs in a kernel thread, so the IOKit service appears long after
          #    SpringBoard asks for its OpenGL ES context, and Mesa keeps softpipe for the
          #    life of that process. The start must not return before the service exists.
          old3 = ("        if(kernel_thread_start(marble_runtime_thread,NULL,&worker)!=KERN_SUCCESS) {\n"
                  "            __atomic_store_n(&runtime_inflight,0,__ATOMIC_RELEASE);\n"
                  "            marble_gpu_log(\"marble-gpu-runtime: worker creation failed\\n\");\n"
                  "        } else thread_deallocate(worker);")
          new3 = ("        if(kernel_thread_start(marble_runtime_thread,NULL,&worker)!=KERN_SUCCESS) {\n"
                  "            __atomic_store_n(&runtime_inflight,0,__ATOMIC_RELEASE);\n"
                  "            marble_gpu_log(\"marble-gpu-runtime: worker creation failed\\n\");\n"
                  "        } else {\n"
                  "            unsigned waited=0;\n"
                  "            for(;waited<3000;waited++) {\n"
                  "                if(__atomic_load_n(&service_started,__ATOMIC_ACQUIRE))break;\n"
                  "                delay(10000);\n"
                  "            }\n"
                  "            marble_gpu_log(\"marble-gpu-runtime: waited %u ms for the service\\n\",waited*10);\n"
                  "            thread_deallocate(worker);\n"
                  "        }")
          if old3 not in s:
              sys.exit('marble_runtime_thread start: pattern not found')
          p.write_text(s.replace(old3, new3, 1))
          print('patched marble_gpu_ready and the GPU start wait')

          # 3. Say, in the log, whether a program was given a user client at all.
          q = pathlib.Path('xnu/files/iokit/Kernel/RedwoodGPU.cpp')
          t = q.read_text()
          old1 = ("\tif (!IOUserClient::initWithTask(owningTask, securityID, type, properties)) {\n"
                  "\t\treturn false;\n"
                  "\t}\n"
                  "\tfTask = owningTask;")
          new1 = ("\tIOLog(\"RedwoodGPU: a user client is asked for (type %u, ready %d)\\n\", (unsigned) type,\n"
                  "\t    (int) redwood_gpu_ready());\n"
                  "\tif (!IOUserClient::initWithTask(owningTask, securityID, type, properties)) {\n"
                  "\t\tIOLog(\"RedwoodGPU: IOUserClient::initWithTask refused the client\\n\");\n"
                  "\t\treturn false;\n"
                  "\t}\n"
                  "\tfTask = owningTask;")
          if old1 not in t:
              sys.exit('RedwoodGPUUserClient::initWithTask: pattern not found')
          t = t.replace(old1, new1, 1)

          old2 = ("\tif (!redwood_gpu_ready() || !IOUserClient::start(provider)) {\n"
                  "\t\treturn false;\n"
                  "\t}")
          new2 = ("\tif (!redwood_gpu_ready()) {\n"
                  "\t\tIOLog(\"RedwoodGPU: the client is not started: the GPU is not ready\\n\");\n"
                  "\t\treturn false;\n"
                  "\t}\n"
                  "\tif (!IOUserClient::start(provider)) {\n"
                  "\t\tIOLog(\"RedwoodGPU: IOUserClient::start refused the client\\n\");\n"
                  "\t\treturn false;\n"
                  "\t}\n"
                  "\tIOLog(\"RedwoodGPU: a user client is open\\n\");")
          if old2 not in t:
              sys.exit('RedwoodGPUUserClient::start: pattern not found')
          q.write_text(t.replace(old2, new2, 1))
          print('instrumented RedwoodGPUUserClient')

          # 3b. Marble's EPSS block is at 0x17d91000, not redwood's 0x18591000
          #     (the tree's own marble_cpu_probe() checks for exactly 0x17d91000).
          #     Writing the wrong block is a hang, so also refuse a table that does
          #     not look like a frequency table before any register write.
          c = pathlib.Path('xnu/files/bsd/dev/redwood_cpufreq.c')
          s2 = c.read_text()
          oldb = '#define EPSS_PHYS               0x18591000UL'
          newb = '#define EPSS_PHYS               0x17d91000UL'
          if oldb not in s2:
              sys.exit('EPSS_PHYS: pattern not found')
          s2 = s2.replace(oldb, newb, 1)

          oldg = ("\twas = *(volatile uint32_t *)(base + EPSS_PERF_STATE);\n"
                  "\t*(volatile uint32_t *)(base + EPSS_PERF_STATE) = top;")
          newg = ("\tif (top == 0 || top_khz < 200000 || top_khz > 4000000) {\n"
                  "\t\ttell(\"cpufreq: group %u table looks wrong (top %u, %u kHz); no writes\\n\", domain, top, top_khz);\n"
                  "\t\treturn;\n"
                  "\t}\n"
                  "\twas = *(volatile uint32_t *)(base + EPSS_PERF_STATE);\n"
                  "\t*(volatile uint32_t *)(base + EPSS_PERF_STATE) = top;")
          if oldg not in s2:
              sys.exit('raise_domain write: pattern not found')
          c.write_text(s2.replace(oldg, newg, 1))
          print('pointed EPSS at 0x17d91000 and guarded the write')

          # 4. If a build tree is already present, setup will not re-copy xnu/files.
          tree = pathlib.Path('xnu-src/xnu-8796.121.2')
          if tree.is_dir():
              shutil.copyfile(p, tree / 'bsd/dev/marble_adreno.c')
              shutil.copyfile(q, tree / 'iokit/Kernel/RedwoodGPU.cpp')
              shutil.copyfile(c, tree / 'bsd/dev/redwood_cpufreq.c')
              print('copied the patched files into the existing build tree')
          PY

      - name: Prepare Theos and the toolchain
        working-directory: marble
        env:
          THEOS: /home/runner/theos
        run: |
          mkdir -p "$THEOS"
          bash tools/marble-linux-build.sh setup 2>&1 | tee out-setup.log || {
            echo "===== setup failed, tail ====="
            tail -60 out-setup.log
            exit 1
          }

      - name: Build the kernel
        working-directory: marble
        env:
          THEOS: /home/runner/theos
          JOBS: 4
        run: |
          set +e
          bash tools/marble-linux-build.sh kernel 2>&1 | tee out-kernel.log
          rc=$?
          echo "build script exit: $rc"
          ls -l out/linux-build/ || true
          exit 0

      - name: Surface the diagnostics
        if: always()
        working-directory: marble
        run: |
          echo "===== out/linux-build ====="
          ls -l out/linux-build/ 2>/dev/null || true
          if [ -f out/linux-build/kernel.log ]; then
            echo "===== kernel.log: errors ====="
            grep -n -E 'error:|Undefined symbols|ld: |linker command failed|fatal error' out/linux-build/kernel.log | head -60 || true
            echo "===== kernel.log: tail ====="
            tail -40 out/linux-build/kernel.log
          fi
          echo "===== setup log tail ====="
          tail -20 out-setup.log 2>/dev/null || true
          echo done

      - name: Collect the artifacts
        if: always()
        run: |
          mkdir -p dist
          cp marble/out/linux-build/mach.marble-source dist/ 2>/dev/null || true
          cp marble/out/linux-build/mach.json dist/ 2>/dev/null || true
          cp marble/out/linux-build/kernel.log dist/ 2>/dev/null || true
          cp marble/out/linux-build/kernel.syms dist/ 2>/dev/null || true
          cp marble/out-setup.log dist/ 2>/dev/null || true
          cp marble/out-kernel.log dist/ 2>/dev/null || true
          ls -l dist

      - name: Upload the artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marble-touch-kernel
          path: dist
          if-no-files-found: warn
          retention-days: 14
